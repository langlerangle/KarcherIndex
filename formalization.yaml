        spend_usd: "free"
        hardware: "API-only"
      prompting_notes: "Statement file with a proof-route sketch in the header; 'fill in the sorry'."
  wall_time: "approximately two months, intermittently"
  spend_usd: "subscriptions"
  notes: >-
    The author directed the project and reviewed mathematical statements and design
    decisions. The reported time is the approximate project calendar span, not cumulative
    person-hours or compute time. Source review, cached elaboration,
    and clean rebuilding are distinct
    verification activities; a record of one does not imply the others. Numerical
    certificates require separate build and axiom checks.

fidelity:
  divergences: >-
    The surfaces are constructed from Enneper-Weierstrass data; no surface-uniqueness theorem is
    asserted. General topological genus identification, standalone completeness and end
    asymptotic classification, half-period graphicality, and the proposed geometric
    interpretations of exceptional ODE solutions are outside scope. Retained cellular
    and Euler-characteristic certificates do not identify the genus of the geometric
    quotient. The class-zero mixed-boundary index and nullity follow the paper's
    strict Dirichlet-mixed-Neumann eigenvalue bracketing argument. The main two-period
    index proof uses this route; the constructive Gram-matrix proof is retained as
    an alternative.
    In the checkerboard containment of Theorem 1.1(v) of arXiv:2608.13451v2,
    the radial parameter includes zero (r >= 0, in place of the printed r > 0).
    For k=3 and rotational character j=2 mod 3, the screw action on lower-trace Fourier
    coefficients is exp(i pi (alpha+2/3)) times the circle involution, on finite period
    quotients at rational phase alpha=n/m. The circle
    half-order domain uses the weight 1+|l|, equivalent to but not identical with the
    paper's sqrt(1+l^2), and expresses half-arc support by sgnHat * u = u.
    Neither irrationality nor an exact value of alpha* is claimed. The numerical
    interval does establish nonintegrality of m alpha* for every positive m <= 2298,
    together with explicit floor values and the corresponding geometric index/nullity
    formulas. README.md describes the public scope and verification boundaries.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 4.8 (Kai)"
    - "Claude Fable 5 (Xi)"
    - "GPT-6 Astra (OpenAI)"
    - "Claude Opus 5.5 (fresh-session source reviewer)"
  notes: >-
    Development-team agents have performed statement-fidelity, source and documentation
    reviews at their recorded scopes. These activities are distinct from Lean kernel
    verification and do not constitute external human peer review or exhaustive
    independent review of every proof. The author directed the work and reviewed
    mathematical design decisions, and reviewed the earlier definition guide and the
    statements and definitions it references. The author has also reviewed and approved
    the final combined repository for public availability. A fresh-session Claude
    Opus 5.5 review examined public commit 97b6d52aa27c9dfc0028e4cc3efdb3ed70da6187
    through source reading and scripted checks, without building the project or
    running Comparator. The reviewer belongs to the same model family as earlier
    Claude collaborators. A follow-up review of public commit
    98ac7ef76394a0617ef48e422904b0171d51fb4e independently confirmed that the Lean
    changes were comment-only, checked the revised mathematical documentation,
    and found no changes required before submission. Neither review included a build or Comparator run.

alignment:
  scope: >-
    One combined entry selects the five declarations listed in comparator.json,
    all in namespace KSPalomar.Intrinsic.Full. The geometric staircase and the
    numerical endpoints share one spectral threshold definition. The following
    list records supporting library carriers as well as the selected results;
    it is not a claim that every supporting declaration is separately compared.
    The repository contains the substantive formalization development; its comparator
    Solution module is a thin re-export of proofs from that development.
  statements:
    - source: "Two-period realization: index 4k-3 and bounded Jacobi-field nullity 3 for every k >= 3"
      lean: "KSPalomar.Intrinsic.Full.exists_intrinsic_index_nullity_m2"
      module: "Palomar.Solution"
      status: "proved; selected by comparator.json"
    - source: "One base realization and threshold for k=3, with compatible quotient witnesses and index/nullity formulas for every positive period"
      lean: "KSPalomar.Intrinsic.Full.exists_intrinsic_staircase_k3"
      module: "Palomar.Solution"
      status: "proved; selected by comparator.json"
    - source: "Exactly one real parameter satisfies the shared spectral sign characterization IsThreshold"
      lean: "KSPalomar.Intrinsic.Full.unique_threshold"
      module: "Palomar.Solution"
      status: "proved; selected by comparator.json"
    - source: "Every threshold parameter has criticalPhase strictly between 0.4323617 and 0.4323619"
      lean: "KSPalomar.Intrinsic.Full.decimal_bounds"
      module: "Palomar.Solution"
      status: "proved; selected by comparator.json"
    - source: "For 0 < m <= 2298, floor(m criticalPhase) = floor(4323617m/10000000) and m criticalPhase is nonintegral"
      lean: "KSPalomar.Intrinsic.Full.period_arithmetic"
      module: "Palomar.Solution"
      status: "proved; selected by comparator.json"
    - source: "Two-period geometric index, k >= 3"
      lean: "KsIndex.KarcherData.PaperHalfPeriodRealization.geometricIndex_two"
      module: "KsIndexLean.KarcherGeometricCapstone"
      status: "proved in library"
    - source: "Two-period bounded-field nullity, k >= 3"
      lean: "KsIndex.KarcherData.PaperHalfPeriodRealization.geometricNullity_two"
      module: "KsIndexLean.KarcherGeometricCapstone"
      status: "proved in library"
    - source: "Six-ended geometric index, every positive period"
      lean: "KsIndex.KarcherData.PaperHalfPeriodRealization.geometricIndex_three"
      module: "KsIndexLean.KarcherGeometricCapstone"
      status: "proved in library"
    - source: "Six-ended bounded-field nullity dichotomy"
      lean: "KsIndex.KarcherData.PaperHalfPeriodRealization.geometricNullity_three"
      module: "KsIndexLean.KarcherGeometricCapstone"
      status: "proved in library"
    - source: "Constructed realization with two-period formulas"
      lean: "KsIndex.KarcherData.PaperHalfPeriodRealization.exists_geometric_double_period"
      module: "KsIndexLean.KarcherGeometricCapstone"
      status: "proved in library"
    - source: "One realization and threshold for all six-ended periods"
      lean: "KsIndex.KarcherData.PaperHalfPeriodRealization.exists_geometric_six_end_formulas"
      module: "KsIndexLean.KarcherGeometricCapstone"
      status: "proved in library"
    - source: "Proper smooth EW embedding, k >= 2"
      lean: "KsIndex.KarcherData.exists_proper_embedded_EW_realization"
      module: "KsIndexLean.KarcherProperEmbedding"
      status: "proved in library"
    - source: "Boundedness iff finite Dirichlet energy for smooth geometric Jacobi fields"
      lean: "KsIndex.KarcherData.PaperHalfPeriodRealization.geometric_jacobi_finiteness"
      module: "KsIndexLean.KarcherGeometricJacobiFiniteness"
      status: "proved in library"
    - source: "Strict lower decimal bound"
      lean: "KsIndex.AlphaRemarkTrial.LowerAssembly.alphaStar_gt_4323617"
      module: "KsIndexLean.AlphaRemarkLowerCertified"
      status: "proved in library"
    - source: "Strict upper decimal bound"
      lean: "KsIndex.NegSignProd.alphaStar_lt_upper_decimal"
      module: "KsIndexLean.NegSignDecimal"
      status: "proved in library"
    - source: "Class-zero mixed index 1 and nullity 0 by strict bracketing, k >= 3"
      lean: "KsIndex.Spectral.mixed_class_zero_pair_bracketing_uncond"
      module: "KsIndexLean.MixedClassZeroBracketing"
      status: "proved in library"
    - source: "Explicit floor values for every positive m <= 2298"
      lean: "KsIndex.Staircase.alphaStar_floor_le_2298"
      module: "KsIndexLean.AlphaStarNumericalPeriods"
      status: "proved in library"
    - source: "Nonresonance for every positive m <= 2298"
      lean: "KsIndex.Staircase.alphaStar_nonresonant_le_2298"
      module: "KsIndexLean.AlphaStarNumericalPeriods"
      status: "proved in library"
    - source: "Explicit geometric index and nullity 3 for every positive m <= 2298"
      lean: "KsIndex.KarcherData.PaperHalfPeriodRealization.geometric_numerical_periods"
      module: "KsIndexLean.KarcherNumericalPeriods"
      status: "proved in library"
    - source: "Introductory small-period corollary with constructed realization"
      lean: "KsIndex.KarcherData.PaperHalfPeriodRealization.exists_geometric_small_periods"
      module: "KsIndexLean.KarcherSmallPeriods"
      status: "proved in library"
  submission_preparation: >-
    The combined geometric and numerical entry uses a public re-export Solution
    module and five comparator targets. The repository is public. The source audit
    and follow-up described above concern the historical commits named in that
    review record; subsequent proof optimizations have separate validation evidence.
    The optimized candidate's local and hosted component checks are described in the
    README. A complete Palomar verification of this successor remains outstanding.
    This metadata does not claim registry acceptance.

