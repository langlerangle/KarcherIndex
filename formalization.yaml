      models: ["Claude Fable 5", "Claude Opus 4.8"]
      framework: "Claude Code"
      tool_setup: >-
        AI-assisted: definitions, statements and proofs drafted and iterated by the models in
        Claude Code sessions against a local Lean/Mathlib build; statements, design decisions
        and mathematical review by the author. Selected principal declarations are checked
        with #print axioms in Inventory. The Claude collaboration on the formalization
        continues the collaboration acknowledged in the paper.
        The project uses Tau Ceti at the pinned revision for supporting analytic
        infrastructure, including selected proof bodies and interfaces for interior
        elliptic regularity and Sobolev analysis.
      cost:
        spend_usd: "subscriptions"
        hardware: "local machine"
      prompting_notes: >-
        Collaborative peer-style sessions: the author supplies the mathematics and reviews
        mathematical statements and design decisions; the models propose designs, write Lean,
        and flag faithfulness concerns.
    - method: "agent"
      models: ["GPT-6 Astra"]
      framework: "Codex"
      tool_setup: >-
        OpenAI-assisted proof development, source-fidelity review, numerical certification,
        integration checks, and public documentation review. These project-level roles
        do not assign authorship of every declaration in the development.
    - method: "other"
      models: ["Harmonic Aristotle"]
      framework: "Aristotle API"
      tool_setup: |
        Aristotle contributed proofs of selected lemmas, checked in the project's
        Lean environment. The following table records selected Aristotle contributions;
        it is not an exhaustive contribution history.
        These entries retain their historical credits without claiming a new validation
        of the original job logs or a fresh build on the current toolchain.

        | `KsIndexLean/JacobiFields.lean` | Aristotle proofs; statements by Claude | `e45f5dd8` (batch 3) |
        | `KsIndexLean/JacobiFieldsSym.lean` | Aristotle proofs; statements by Claude | `8ebbad09` (batch 4) |
        | `KsIndexLean/PunctureCutoff.lean` | Claude, **Part B only** (the radial annulus integral) by Aristotle | batch 5 (`e2238df3`) |
        | `KsIndexLean/ClosedDiskExt.lean` | Aristotle proof; statement by Claude | `dffeecf1` (batch 6) |
        | `KsIndexLean/BallPolar.lean` | Aristotle proof; statement + route by Claude | `1d1d8d00` |
        | `KsIndexLean/NonnegSwap.lean` | Aristotle proof; statement + route by Claude | `cba68e4a` |
        | `KsIndexLean/ArcKernel.lean` | Aristotle proofs; statements + sketches by Claude | `6911b25f-…` (v4.28 probe) |
        | `KsIndexLean/SquareWave.lean` | Aristotle proof; statement by Claude | `eef2c6d6` (v4.28 probe) |
