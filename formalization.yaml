version: "v0.4"

project:
  name: "KarcherIndex"
  description: >-
    A Lean 4 formalization of the Morse index and nullity of Karcher saddle towers,
    formalizing results from arXiv:2608.13451v2.
    For the Enneper-Weierstrass realizations, the two-period quotient Xi_{k,2}
    has index 4k-3 and bounded Jacobi-field nullity 3 for every k >= 3. For the six-ended
    family Xi_{3,m}, every positive integer m has index 6m-4 floor(m alpha*)-3 and nullity
    7 when m alpha* is an integer, and 3 otherwise. The same threshold alpha* lies in
    (1/3,1/2), with certified strict bounds 0.4323617 < alpha* < 0.4323619.
    As in the paper, index and nullity are defined using complex-valued functions,
    with dimensions taken over the complex numbers. The development constructs realizations from
    the explicit data and supplies the geometric-to-analytic identifications, rather
    than assuming the existence of a realization. Supporting results include proper
    embeddedness and the equivalence of boundedness and finite Dirichlet energy for
    smooth geometric Jacobi fields on the finite period quotients.
  authors:
    - "David Wiygul"
  license: "Apache-2.0"
  responsible_maintainers:
    - "David Wiygul"

classification:
  arxiv: ["math.DG", "math.SP"]
  msc2020: ["53A10", "58E12", "47B93", "35P15"]

sources:
  - title: "Morse index of Karcher saddle towers in R^2 x S^1(m)"
    authors:
      - "David Wiygul"
    id: "arXiv:2608.13451"
    type: "paper"
    location: "https://arxiv.org/abs/2608.13451v2"
    relationship: "formalizes"
    note: >-
      The audited source is arXiv version 2. The proposed submission covers the main
      two-period and six-ended geometric index/nullity formulas, the supporting EW
      realizations and identifications, and a rigorous certification of the paper's
      heuristic decimal estimate for alpha*. The paper describes 0.4323618(1) as
      heuristic and gives the m <= 2298 arithmetic consequences conditionally on
      that estimate. The formalization proves the strict enclosure and those
      finite-period consequences.
      The single-arc circle theorem is a supporting result, not the full submission
      scope. The checkerboard containment in Theorem 1.1(v) of arXiv:2608.13451v2
      requires the endpoint correction r >= 0 (in place of r > 0).
      Specific omissions and differences of proof route are stated below.
    license: "CC-BY-4.0"
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    The library proves the stated geometric formulas for supplied PaperHalfPeriodRealization
    objects and separately constructs such objects from the Enneper-Weierstrass data; existential
    capstones combine existence and the formulas. Index is defined by the intrinsic
    Jacobi quadratic form on compactly supported smooth complex tests; nullity is the
    complex dimension of bounded smooth geometric Jacobi fields. The decimal bounds
    are included in the combined submission target. The
    introductory evaluations for m in {1,2,3,4,6} use qualitative threshold bounds.
    An explicit numerical target also proves floor(m alpha*) = floor(4323617 m / 10000000)
    and nonintegrality of m alpha* for every positive m <= 2298, yielding explicit
    geometric index values and nullity 3 throughout that range.
    The combined Challenge selects two geometric endpoints, threshold uniqueness,
    strict decimal bounds, and the arithmetic consequences through period 2298.
    The original published snapshot passed the local build and kernel checks described
    in the README. The optimized candidate preserves the five selected results and
    has passed local comparison, an axiom check, and both stock kernels. Hosted
    component checks also passed comparison, axiom checking, and both mandatory
    kernels on the same exports. A bounded con-ron attempt reached its 30-minute
    resource limit and received a recognized capacity-decline classification from
    the pinned Palomar verifier. This permitted decline is not con-ron acceptance.
    A separate hosted cold build reproduced those exports byte for byte. Component
    checks do not constitute a complete hosted pipeline verdict or registry acceptance.
  sorry_count: 0  # Excludes the five deliberate Challenge statement placeholders.
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

